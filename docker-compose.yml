
# ---------------------------------------------------------------------------
# n8n – self-hosted workflow automation
# ---------------------------------------------------------------------------
# Persistent data is written to ./data (git-ignored).
# SQLite is used as the database backend (no external DB required).
#
# restart: unless-stopped ensures the container comes back up automatically
# after a host reboot (OrbStack starts with macOS on login).
#
# Logs are written to a bind-mount whose host path is set via HOST_LOG_PATH
# in .env. Point that variable at the folder watched by your Loki/Promtail
# instance so .log files are picked up automatically.
#
# Music downloads:
#   yt-dlp, ffmpeg, and spotdl are baked into the custom image at build time
#   via the Dockerfile. Set MUSIC_DOWNLOAD_PATH in .env to the absolute host
#   path where downloaded tracks should land. This is the same folder that
#   Navidrome (shockwave) points its MUSIC_PATH at, so new tracks are picked
#   up by the library scanner automatically.
# ---------------------------------------------------------------------------

services:
  n8n:
    build:
      context: .
      dockerfile: Dockerfile
    image: n8n-custom:latest
    container_name: n8n
    restart: unless-stopped

    ports:
      - "${N8N_PORT:-5678}:5678"

    environment:
      # ── Core ──────────────────────────────────────────────────────────────
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
      - N8N_PAYLOAD_SIZE_MAX=${N8N_PAYLOAD_SIZE_MAX:-128}

      # ── Database (SQLite) ─────────────────────────────────────────────────
      - DB_TYPE=sqlite
      - DB_SQLITE_DATABASE=/home/node/.n8n/database.sqlite

      # ── User management ───────────────────────────────────────────────────
      # n8n built-in auth is enabled by default (owner account created on
      # first launch via the web UI).
      - N8N_USER_MANAGEMENT_DISABLED=false

      # ── Encryption key (REQUIRED – generate with: openssl rand -hex 32) ──
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}

      # ── Timezone ──────────────────────────────────────────────────────────
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-America/New_York}
      - TZ=${GENERIC_TIMEZONE:-America/New_York}

      # ── Telemetry (opt-out) ────────────────────────────────────────────────
      - N8N_DIAGNOSTICS_ENABLED=${N8N_DIAGNOSTICS_ENABLED:-false}
      - N8N_VERSION_NOTIFICATIONS_ENABLED=${N8N_VERSION_NOTIFICATIONS_ENABLED:-true}

      # ── Logging ───────────────────────────────────────────────────────────
      # Write logs to files so Loki/Promtail can scrape them from HOST_LOG_PATH.
      - N8N_LOG_OUTPUT=${N8N_LOG_OUTPUT:-file}
      - N8N_LOG_LEVEL=${N8N_LOG_LEVEL:-info}
      # Container-side log directory – always fixed; only the host-side mount
      # changes (see HOST_LOG_PATH in .env).
      - N8N_LOG_FILE_LOCATION=/home/node/.n8n/logs/n8n.log
      # Keep up to 30 rotated log files (one per day by default).
      - N8N_LOG_FILE_COUNT=${N8N_LOG_FILE_COUNT:-30}

      # ── Executions ────────────────────────────────────────────────────────
      - EXECUTIONS_DATA_SAVE_ON_ERROR=${EXECUTIONS_DATA_SAVE_ON_ERROR:-all}
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=${EXECUTIONS_DATA_SAVE_ON_SUCCESS:-all}
      - EXECUTIONS_DATA_SAVE_ON_PROGRESS=${EXECUTIONS_DATA_SAVE_ON_PROGRESS:-false}
      - EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=${EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS:-true}
      - EXECUTIONS_DATA_PRUNE=${EXECUTIONS_DATA_PRUNE:-true}
      - EXECUTIONS_DATA_MAX_AGE=${EXECUTIONS_DATA_MAX_AGE:-336}

      # ── Execute Command node ───────────────────────────────────────────────────
      # In n8n v2+, executeCommand is excluded by default. Setting NODES_EXCLUDE
      # to an empty array re-enables it (and any other excluded nodes).
      - NODES_EXCLUDE=${NODES_EXCLUDE:-[]}

      # ── Music downloads ────────────────────────────────────────────────────
      # Container-side path where yt-dlp / spotdl drop downloaded tracks.
      # Mapped from MUSIC_DOWNLOAD_PATH on the host (see .env).
      - MUSIC_DOWNLOAD_PATH=/music

      # ── AI Assistant / Sandbox ────────────────────────────────────────────
      # Enables the built-in AI Assistant module.
      - N8N_ENABLED_MODULES=${N8N_ENABLED_MODULES:-instance-ai}
      # Point n8n at the local sandbox-api container.
      - N8N_INSTANCE_AI_SANDBOX_ENABLED=${N8N_INSTANCE_AI_SANDBOX_ENABLED:-true}
      - N8N_SANDBOX_SERVICE_URL=${N8N_SANDBOX_SERVICE_URL:-http://sandbox-api:8080}
      # Shared secret – must match SANDBOX_API_KEYS on the sandbox-api container.
      - N8N_SANDBOX_SERVICE_API_KEY=${N8N_SANDBOX_SERVICE_API_KEY}

      # ── Web Search (SearXNG) ──────────────────────────────────────────
      # Internal URL used by the AI Assistant to query your SearXNG instance.
      - N8N_INSTANCE_AI_SEARXNG_URL=${N8N_INSTANCE_AI_SEARXNG_URL:-http://searxng:8080}

    volumes:
      # All n8n data (SQLite DB, credentials, workflows, binary files) is
      # stored here. This folder is git-ignored so it never enters version
      # control, but is easy to back up with a simple script.
      - ./data:/home/node/.n8n

      # Log files are written inside the container at /home/node/.n8n/logs/
      # and exposed on the host at HOST_LOG_PATH (set in .env).
      # Loki/Promtail should watch HOST_LOG_PATH for *.log files.
      - ${HOST_LOG_PATH}:/home/node/.n8n/logs

      # Music library: mounted read-write so yt-dlp / spotdl can write files.
      # Point MUSIC_DOWNLOAD_PATH at the same folder Navidrome watches so new
      # tracks are picked up by the library scanner automatically.
      - ${MUSIC_DOWNLOAD_PATH:?MUSIC_DOWNLOAD_PATH must be set in .env}:/music

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    # ── Kubernetes-readiness hint ─────────────────────────────────────────
    # Labels follow the common Kubernetes label convention so that if you
    # import this Compose spec via Kompose (or write a Deployment by hand)
    # the selectors are already in place.
    labels:
      app.kubernetes.io/name: "n8n"
      app.kubernetes.io/component: "workflow-engine"
      app.kubernetes.io/managed-by: "docker-compose"

    # n8n must be on the sandbox-service network to resolve sandbox-api by
    # hostname, and on the searxng network to reach the search service.
    # No host port is exposed for sandbox-api or searxng.
    networks:
      - default
      - sandbox-service
      - searxng

  # ---------------------------------------------------------------------------
  # Sandbox stack – required for the AI Assistant to run code
  # ---------------------------------------------------------------------------
  # Official images from Docker Hub (n8nio org). Source:
  # https://github.com/n8n-io/n8n-sandbox-service/blob/main/docs/examples/compose.macos.yaml
  #
  # tls-init is a one-shot container that generates mTLS certificates on first
  # run. It exits normally after completing — this is expected, not an error.
  tls-init:
    image: n8nio/n8n-sandbox-service-api:latest
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command:
      - >-
        bootstrap-mtls.sh
        --out-dir /tls
        --api-san n8n-sandbox-api-local
        --control-san-prefix n8n-sandbox-runner
        && chown -R sandbox-api:sandbox-api /tls/api
    environment:
      NUM_RUNNERS: ${NUM_RUNNERS:-1}
    volumes:
      - ./.tls:/tls
    networks:
      - sandbox-service

  # sandbox-api is the control plane. n8n talks to it on port 8080 (internal
  # to the sandbox-service network – not exposed on the host).
  sandbox-api:
    image: n8nio/n8n-sandbox-service-api:latest
    restart: unless-stopped
    depends_on:
      tls-init:
        condition: service_completed_successfully
    volumes:
      - ./.tls/api:/tls:ro
      - sandbox-api-data:/var/lib/n8n-sandbox-api
    environment:
      # Must match N8N_SANDBOX_SERVICE_API_KEY in the n8n service above.
      SANDBOX_API_KEYS: ${N8N_SANDBOX_SERVICE_API_KEY}
      SANDBOX_API_RUNNER_REGISTRATION_TOKEN: ${SANDBOX_API_RUNNER_REGISTRATION_TOKEN}
      SANDBOX_API_RUNNER_API_KEY: ${SANDBOX_API_RUNNER_API_KEY}
      SANDBOX_API_GRPC_TLS_CERT_FILE: /tls/grpc-server.crt
      SANDBOX_API_GRPC_TLS_KEY_FILE: /tls/grpc-server.key
      SANDBOX_API_GRPC_TLS_CLIENT_CA_FILE: /tls/ca.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CA_FILE: /tls/ca.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CERT_FILE: /tls/control-grpc-api-client.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_KEY_FILE: /tls/control-grpc-api-client.key
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks:
      sandbox-service:
        aliases:
          - n8n-sandbox-api
    labels:
      app.kubernetes.io/name: "sandbox-api"
      app.kubernetes.io/component: "sandbox"
      app.kubernetes.io/managed-by: "docker-compose"

  # sandbox-runner is the Docker-in-Docker executor. privileged: true is
  # required on macOS (sysbox-runc is Linux-only).
  sandbox-runner:
    image: n8nio/n8n-sandbox-service-runner-dind:latest
    restart: unless-stopped
    privileged: true
    depends_on:
      tls-init:
        condition: service_completed_successfully
      sandbox-api:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./.tls/runner:/tls:ro
    environment:
      SANDBOX_RUNNER_API_KEYS: ${SANDBOX_RUNNER_API_KEYS}
      SANDBOX_RUNNER_REGISTRATION_TOKEN: ${SANDBOX_RUNNER_REGISTRATION_TOKEN}
      SANDBOX_RUNNER_DOCKER_SANDBOX_IMAGE: n8nio/n8n-sandbox-service-sandbox:latest
      SANDBOX_RUNNER_API_GRPC_ADDR: n8n-sandbox-api:9090
      SANDBOX_RUNNER_HTTP_BASE_URL: https://n8n-sandbox-runner-1:8080
      SANDBOX_RUNNER_CONTROL_GRPC_LISTEN_ADDR: ":9091"
      SANDBOX_RUNNER_CONTROL_GRPC_ADVERTISE_ADDR: n8n-sandbox-runner-1:9091
      SANDBOX_RUNNER_REGISTRATION_GRPC_CA_FILE: /tls/ca.crt
      SANDBOX_RUNNER_REGISTRATION_GRPC_CERT_FILE: /tls/grpc-client.crt
      SANDBOX_RUNNER_REGISTRATION_GRPC_KEY_FILE: /tls/grpc-client.key
      SANDBOX_RUNNER_REGISTRATION_GRPC_SERVER_NAME: n8n-sandbox-api-local
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_CERT_FILE: /tls/control-grpc-server.crt
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_KEY_FILE: /tls/control-grpc-server.key
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_CLIENT_CA_FILE: /tls/ca.crt
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--no-check-certificate", "https://localhost:8080/readyz"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    networks:
      sandbox-service:
        aliases:
          - n8n-sandbox-runner-1
    labels:
      app.kubernetes.io/name: "sandbox-runner"
      app.kubernetes.io/component: "sandbox"
      app.kubernetes.io/managed-by: "docker-compose"

  # ---------------------------------------------------------------------------
  # SearXNG – free, self-hosted web search for the AI Assistant
  # ---------------------------------------------------------------------------
  # n8n's AI Assistant will call http://searxng:8080 to perform searches.
  # JSON output is enabled via SEARXNG_SEARCH__FORMATS so n8n can parse results.
  # No API key is required.
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    environment:
      # Must be reachable from the browser (used by SearXNG's own UI).
      # For a purely internal setup this can be the same as the Docker hostname.
      - SEARXNG_BASE_URL=${SEARXNG_BASE_URL:-http://localhost:8081/}
    # Expose on host port 8081 so you can test it directly in a browser
    # (http://localhost:8081). n8n reaches it internally on port 8080.
    ports:
      - "8081:8080"
    volumes:
      # Custom settings: enables JSON output and disables the bot limiter so
      # n8n's HTTP client can query the /search?format=json endpoint.
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - searxng
    labels:
      app.kubernetes.io/name: "searxng"
      app.kubernetes.io/component: "web-search"
      app.kubernetes.io/managed-by: "docker-compose"

networks:
  # sandbox-service is an internal bridge. n8n joins it (see networks: below)
  # so it can reach sandbox-api without exposing port 8080 on the host.
  sandbox-service:
    driver: bridge
  # searxng is an internal bridge shared between n8n and the searxng container.
  searxng:
    driver: bridge

# ---------------------------------------------------------------------------
# Named volumes
# ---------------------------------------------------------------------------
volumes:
  sandbox-api-data:
