apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: n8n
  labels:
    app.kubernetes.io/name: n8n
    app.kubernetes.io/component: workflow-engine
spec:
  # SQLite supports only a single writer. Keep replicas at 1.
  # To scale horizontally, migrate to PostgreSQL and set replicas > 1.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: n8n
  strategy:
    type: Recreate          # Required with SQLite / ReadWriteOnce PVC
  template:
    metadata:
      labels:
        app.kubernetes.io/name: n8n
        app.kubernetes.io/component: workflow-engine
    spec:
      securityContext:
        # n8n runs as UID 1000 (node user) inside the container
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

      containers:
        - name: n8n
          image: n8nio/n8n:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 5678
              protocol: TCP

          env:
            # ── Core ──────────────────────────────────────────────────────
            - name: N8N_HOST
              value: "0.0.0.0"
            - name: N8N_PORT
              value: "5678"
            - name: N8N_PROTOCOL
              value: "http"   # Change to "https" when using TLS termination
            - name: N8N_PAYLOAD_SIZE_MAX
              value: "128"

            # ── Database ──────────────────────────────────────────────────
            - name: DB_TYPE
              value: "sqlite"
            - name: DB_SQLITE_DATABASE
              value: "/home/node/.n8n/database.sqlite"

            # ── User management ───────────────────────────────────────────
            - name: N8N_USER_MANAGEMENT_DISABLED
              value: "false"

            # ── Encryption key (from Secret) ──────────────────────────────
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: n8n-secret
                  key: N8N_ENCRYPTION_KEY

            # ── Timezone ──────────────────────────────────────────────────
            - name: GENERIC_TIMEZONE
              value: "America/New_York"
            - name: TZ
              value: "America/New_York"

            # ── Telemetry ─────────────────────────────────────────────────
            - name: N8N_DIAGNOSTICS_ENABLED
              value: "false"
            - name: N8N_VERSION_NOTIFICATIONS_ENABLED
              value: "true"

            # ── Execution retention ────────────────────────────────────────
            - name: EXECUTIONS_DATA_SAVE_ON_ERROR
              value: "all"
            - name: EXECUTIONS_DATA_SAVE_ON_SUCCESS
              value: "all"
            - name: EXECUTIONS_DATA_SAVE_ON_PROGRESS
              value: "false"
            - name: EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS
              value: "true"
            - name: EXECUTIONS_DATA_PRUNE
              value: "true"
            - name: EXECUTIONS_DATA_MAX_AGE
              value: "336"

          volumeMounts:
            - name: n8n-data
              mountPath: /home/node/.n8n

          livenessProbe:
            httpGet:
              path: /healthz
              port: 5678
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5

          readinessProbe:
            httpGet:
              path: /healthz
              port: 5678
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

      volumes:
        - name: n8n-data
          persistentVolumeClaim:
            claimName: n8n-data
