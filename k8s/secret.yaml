# ─────────────────────────────────────────────────────────────────────────
# IMPORTANT: Fill in the values before applying this file.
#
# Generate the encryption key:
#   openssl rand -hex 32
#
# Encode values in base64 (Linux / macOS):
#   echo -n 'your-value-here' | base64
#
# Encode values in base64 (PowerShell):
#   [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes('your-value'))
#
# Then replace the placeholder strings below.
# ─────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: n8n-secret
  namespace: n8n
  labels:
    app.kubernetes.io/name: n8n
    app.kubernetes.io/component: workflow-engine
type: Opaque
data:
  # base64-encoded 32-byte hex string (output of: openssl rand -hex 32 | base64)
  N8N_ENCRYPTION_KEY: REPLACE_WITH_BASE64_ENCODED_KEY
